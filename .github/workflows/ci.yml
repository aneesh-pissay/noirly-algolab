name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # .npmrc reads this to install @noirly-dev/ui from GitHub Packages. The
      # package must grant this repository read access (package settings →
      # Manage Actions access), or set NOIRLY_PACKAGES_TOKEN to a PAT with
      # read:packages.
      GITHUB_TOKEN: ${{ secrets.NOIRLY_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Build-time placeholders only; nothing connects during `next build`.
          AUTH_SECRET: ci-build-only-7f3c9a1e5b2d8f4a6c0e9b7d3f1a5c8e
          AUTH_NOIRLY_ISSUER: https://identity.invalid
          MONGODB_URI: mongodb://127.0.0.1:27017/noirly-codelab-ci
